name: Deploy to Firebase Hosting on PR
"on": pull_request

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository # Fork PRs get no secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Deploy
        if: github.event.pull_request.user.login != 'dependabot[bot]' # Dependabot PRs get no Actions secrets
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_REIJN_DEV }}"
          projectId: reijn-dev
          expires: 7d

      # Temporary test of Cloudflare hosting: deploys to reijn-dev.<account>.workers.dev only, reijn.dev stays on Firebase
      - name: Deploy to Cloudflare (test)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
