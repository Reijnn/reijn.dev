{{ define "main" }}
    <div class="content">
        <main class="post">

            {{ partial "translations.html" . }}

            <article>
                <h2 class="post-title"{{ with .File }} style="view-transition-name: post-{{ .UniqueID }}"{{ end }}><a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a></h2>

                <div class="post-content">
                    {{ .Content }}
                </div>
            </article>

            <hr />

            <div class="post-info">
                {{ partial "tags.html" .Params.tags }}

                {{ partial "git-info.html" . }}
            </div>
        </main>
    </div>
{{ end }}
