<footer class="footer">
    <div class="footer__inner">
        <div class="footer__content">
            <span>&copy; {{ now.Year }}</span>
            <span>{{ site.Copyright | safeHTML }}</span>
        </div>
    </div>
    {{- with site.Params.footer.bottomText }}
    <div class="footer__inner">
        <div class="footer__content">
            {{ range . }}<span>{{ . | safeHTML }}</span>{{ end }}
        </div>
    </div>
    {{- end }}
</footer>
