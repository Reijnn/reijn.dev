<nav class="menu">
    <ul class="menu__inner">
        {{- $currentPage := . -}}
        {{ range .Site.Menus.main.ByWeight -}}
            {{- $url := .URL | relLangURL }}
            {{- /* "page" on the entry itself, "true" on a page under it, like a post under Posts */}}
            <li><a href="{{ $url }}"{{ if eq $url $currentPage.RelPermalink }} aria-current="page"{{ else if hasPrefix $currentPage.RelPermalink $url }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
    </ul>
</nav>
