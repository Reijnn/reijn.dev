<nav class="menu">
    <ul class="menu__inner">
        {{- $currentPage := . -}}
        {{ range .Site.Menus.main.ByWeight -}}
            {{ if .HasChildren }}
                <div class="submenu">
                    <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn">{{ .Name }}</a>
                    <div class="dropdown-content">
                    {{ range .Children }}
                        <a href="{{ .URL }}">{{ .Name }}</a>
                    {{ end }}
                    </div>
                    </li>
                </div>
            {{ else }}
                <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
            {{ end }}
        {{- end }}
    </ul>
</nav>
