{{ define "main" }}
    <div class="content-center">
        <main>
            <div>
                {{ if .Site.Params.Portrait.Path }}
                <img src="{{ .Site.Params.Portrait.Path }}" class="circle" alt="{{ .Site.Params.Portrait.Alt }}" width="{{ .Site.Params.Portrait.MaxWidth }}" height="{{ .Site.Params.Portrait.MaxHeight }}" fetchpriority="high" />
                {{ end }}

                <h1>{{ .Site.Title }}</h1>

                {{- with .Site.Params.homeSubtitle }}
                    <p>{{.}}</p>
                {{- end }}

                {{- with .Site.Params.social }}
                    <div>
                        {{ range . -}}
                            &nbsp; <a href="{{ .url }}" {{if eq .nonewpage 0}} target="_blank" {{end}} rel="me noopener {{ .rel }}" title="{{ .name | humanize }}">{{ partial "svg.html" . }}</a> &nbsp;
                        {{- end -}}
                    </div>
                {{- end }}
            </div>
        </main>
    </div>
{{ end }}
