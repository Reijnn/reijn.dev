{{ define "main" }}
    <div class="content-center">
        <main>
            <div>
                {{ with .Site.Params.Portrait.Path }}{{ with resources.Get (strings.TrimPrefix "/" .) | fingerprint }}
                <img src="{{ .RelPermalink }}" class="circle" alt="{{ site.Params.Portrait.Alt }}" width="{{ site.Params.Portrait.MaxWidth }}" height="{{ site.Params.Portrait.MaxHeight }}" fetchpriority="high" />
                {{ end }}{{ end }}

                <h1>{{ .Site.Title }}</h1>

                {{ partial "subtitle.html" . }}

                {{- with .Site.Params.social }}
                    <div>
                        {{ partial "social-icons.html" . }}
                    </div>
                {{- end }}
            </div>
        </main>
    </div>
{{ end }}
