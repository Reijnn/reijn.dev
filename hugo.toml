baseURL = "https://reijn.dev"
title = "Niels Reijn"
theme = "hello-friend-ng"

copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>' # Footer shows it as a link; the RSS feed strips the HTML

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
disableHugoGeneratorInject = true

# Mounting a dir drops Hugo's default for it, so assets and static are listed again
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "static/profile.jpg"
target = "assets/images/profile.jpg" # Used for the share cards in head.html

[permalinks]
posts = "/posts/:year/:month/:title/"

[markup]
[markup.goldmark]
[markup.goldmark.extensions]
linkify = true

[markup.highlight]
style = "monokai"
codeFences = true

[taxonomies]
tag = "tags"

[params]
dateformShort = "Jan 2"
dateformNum = "2006-01-02"
dateformNumTime = "2006-01-02 15:04"

description = "Niels Reijn — Software Engineer, Management Consultant, and Product Owner. Writing about technology, privacy, and development."
shareImage = "/profile.jpg" # Shared links to pages without a generated card (head.html)

homeSubtitle = "Software Engineer"

themeColor = "#1b1c1d"

gitUrl = "https://github.com/Reijnn/reijn.dev/commit/"

disableReadOtherPosts = false
enableThemeToggle = true
enableSharingButtons = true

[params.footer]
trademark = true # shows "© <current year>"
rss = false
copyright = true
author = false

topText = []
bottomText = ["Powered by <a href=\"https://gohugo.io\">Hugo</a>"]

[params.favicon]
mask = "#1b1c1d" # Safari pinned-tab icon color

[params.logo]
logoMark = ">"
logoText = "$ cd /home/"
logoCursorColor = "#dcdcdc"

[params.utterances]
repository = "Reijnn/reijn.dev"
issueTerm = "pathname"
label = "comments"

[params.author]
name = "Niels Reijn"

[params.portrait]
path = "/profile.webp"
alt = "Niels Reijn"
maxWidth = "150"
maxHeight = "150"

[[params.social]]
name = "email"
url = "mailto:niels@reijn.dev"

[[params.social]]
name = "github"
url = "https://github.com/reijnn/"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/reijnn/"

[languages]
[languages.en]
locale = "en-US"
label = "English"
weight = 1

[languages.nl]
locale = "nl-NL"
label = "Nederlands"
weight = 2

[menus]
[[menus.main]]
identifier = "about"
name = "About"
url = "about/"
weight = 1
[[menus.main]]
identifier = "posts"
name = "Posts"
url = "posts/"
weight = 2
[[menus.main]]
identifier = "projects"
name = "Projects"
url = "projects/"
weight = 3
