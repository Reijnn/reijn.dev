<script type="text/javascript" src="//localhost:1313/bundle.min.c307ecd8ed21b2515b66123f0490bd5a45c6e1f1df95fb6636d75ea9cd5e1b10ad387d6a6a77dbcdf341efa04621ca89fc243f43edc3597c26f7c6325562d027.js" integrity="sha512-wwfs2O0hslFbZhI/BJC9WkXG4fHflftmNtdeqc1eGxCtOH1qanfbzfNB76BGIcqJ/CQ/Q&#43;3DWXwm98YyVWLQJw=="></script>




<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    function checkWebpSupport(callback) {
      var webp = new Image();
      webp.onload = function() { callback(webp.height === 1); };
      webp.onerror = function() { callback(false); };
      webp.src = 'data:image/webp;base64,UklGRh4AAABXRUJQVlA4TBEAAAAvAAAAAAfQ//73v/+BiOh/AAA=';
    }

    
    checkWebpSupport(function(hasWebP) {
      if (hasWebP) {
        const images = document.querySelectorAll('img');
        images.forEach(img => {
          const src = img.getAttribute('src');
          if (src && !src.includes('data:') && !src.endsWith('.svg') && !src.endsWith('.webp')) {
            
            const webpSrc = src.substring(0, src.lastIndexOf('.')) + '.webp';
            img.setAttribute('srcset', webpSrc);
          }
        });
      }
    });

    
    const images = document.querySelectorAll('img[loading="lazy"]');
    images.forEach(img => {
      
      img.addEventListener('load', function() {
        this.classList.add('loaded');
      });
      
      
      if (!img.complete) {
        img.style.opacity = '0';
        img.classList.add('image-loading');
        img.addEventListener('load', function() {
          this.style.opacity = '1';
          this.classList.remove('image-loading');
        });
      }
    });
  });
</script>
